[general]
; Текущая АЗС:
;   auto    - выбрать при старте из секций [AZS_*] в azs.ini
;             (если секция одна - диалог не показывается)
;   <число> - работать с этой АЗС без диалога, например current_azs=75
current_azs=auto

; Куда копировать (если в [AZS_<номер>] не задан свой output_root)
output_root=D:\VideoExport

; Интервал вокруг docdate из xlsx:
;   start = docdate - minutes_before
;   end   = docdate + minutes_after
; Количество литров (realdose) на интервал НЕ влияет.
minutes_before=2
minutes_after=10

; copy - копировать, move - переносить (исходник удаляется после успешного копирования)
copy_mode=copy
; Потоков копирования (1 = последовательно)
threads=2

; auto = искать X:\VIDEO\ на всех локальных дисках
; или явные пути через ; : D:\VIDEO;E:\VIDEO
video_roots=auto
; Имя подкаталога с видео на диске
video_root_subdir=VIDEO

; Копировать ли звук (.wNN) вместе с видео (._NN)
include_audio=true

[finder]
; Регулярное выражение для имени час-каталога (пример: "12-10-26 10")
; Группы: d - день, m - месяц, y - двузначный год, H - час
path_date_regex=(?P<d>\d{2})-(?P<m>\d{2})-(?P<y>\d{2})\s+(?P<H>\d{2})
; Включить фильтр по дате/часу, извлечённым из имени каталога
path_date_filter=true
; Запас по часам при отборе час-каталогов (для файлов на границе часа)
path_date_margin_hours=1
; Откуда брать время файла: mtime (время изменения) или ctime (время создания)
time_source=mtime
; Суффиксы файлов: NN - номер камеры (01..99), имя файла произвольное
video_suffix_video=._NN
video_suffix_audio=.wNN
; Длительность одного файла-сегмента, сек (0 = неизвестна,
; тогда используется окно интервала +/- 5 минут)
segment_duration_sec=60
; Поправка к времени файла, сек (например -3, если mtime "уезжает" вперёд)
mtime_fix_sec=0
; Служебные каталоги первого уровня, которые нельзя обходить
skip_dirs=META,PROTECTED,INDEX_DATA
