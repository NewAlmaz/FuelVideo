; Файл настроек по АЗС.
; Одна секция = одна АЗС. Имя секции строго [AZS_<номер>].
;
; Параметры секции:
;   video_roots  - необязательный. Список каталогов VIDEO через ;
;                  Если не задан - используется [general].video_roots из settings.ini
;   output_root  - необязательный. Куда копировать.
;                  Если не задан - <[general].output_root>\AZS<номер>
;   trk_N        - список камер (01..99) через запятую для ТРК N.
;                  Одна ТРК может сниматься несколькими камерами: trk_1=07,08
;
; Номера камер можно писать без ведущего нуля: 7 -> 07.

[AZS_75]
; video_roots не задан -> используется [general].video_roots (auto)
output_root=D:\VideoExport\AZS75
trk_1=06,07
trk_2=10,11
trk_3=15
trk_4=16

; Пример второй АЗС (раскомментируйте и поправьте пути):
; [AZS_76]
; video_roots=E:\VIDEO
; output_root=D:\VideoExport\AZS76
; trk_1=01,02
; trk_2=03
